<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kubernetes Spring Boot PostgreSQL 部署演示">
    <title>Kubernetes Java 演示</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
<header class="app-header">
    <div class="page-width header-inner">
        <div>
            <p class="brand-kicker">SPRING BOOT 3 · POSTGRESQL</p>
            <h1>Kubernetes Java 演示</h1>
        </div>
        <span class="runtime-badge">Java 21</span>
    </div>
</header>

<section class="instance-band" aria-labelledby="instance-heading">
    <div class="page-width instance-layout">
        <div>
            <p class="section-label">当前响应实例</p>
            <h2 id="instance-heading" class="instance-name">正在读取...</h2>
        </div>
        <dl class="instance-details">
            <div>
                <dt>Pod IP</dt>
                <dd id="pod-ip">-</dd>
            </div>
            <div>
                <dt>所在节点</dt>
                <dd id="node-name">-</dd>
            </div>
            <div>
                <dt>响应时间</dt>
                <dd id="served-at">-</dd>
            </div>
        </dl>
        <button id="refresh-instance" class="button button-light" type="button">
            <span aria-hidden="true">↻</span>
            刷新实例
        </button>
    </div>
</section>

<main class="page-width workspace">
    <section class="editor-section" aria-labelledby="form-heading">
        <div class="section-heading">
            <div>
                <p class="section-label">数据库写入</p>
                <h2 id="form-heading">添加记录</h2>
            </div>
            <button id="cancel-edit" class="button button-quiet" type="button" hidden>取消修改</button>
        </div>

        <form id="record-form">
            <div class="form-grid">
                <label class="field">
                    <span>标题</span>
                    <input id="record-title" name="title" type="text" maxlength="100" required
                           autocomplete="off">
                </label>
                <label class="field field-wide">
                    <span>内容</span>
                    <textarea id="record-content" name="content" maxlength="1000" rows="4" required></textarea>
                </label>
            </div>
            <div class="form-footer">
                <p id="form-status" class="status-message" role="status" aria-live="polite"></p>
                <button id="submit-record" class="button button-primary" type="submit">添加记录</button>
            </div>
        </form>
    </section>

    <section class="records-section" aria-labelledby="records-heading">
        <div class="section-heading records-heading-row">
            <div>
                <p class="section-label">PostgreSQL</p>
                <h2 id="records-heading">记录列表</h2>
            </div>
            <p class="record-count">共 <strong id="total-records">0</strong> 条</p>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">标题</th>
                    <th scope="col">内容</th>
                    <th scope="col">创建时间</th>
                    <th scope="col" class="actions-column">操作</th>
                </tr>
                </thead>
                <tbody id="record-list">
                <tr>
                    <td colspan="4" class="empty-state">正在读取记录...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" aria-label="记录分页">
            <label class="page-size">
                <span>每页</span>
                <select id="page-size">
                    <option value="5">5 条</option>
                    <option value="10" selected>10 条</option>
                    <option value="20">20 条</option>
                    <option value="50">50 条</option>
                </select>
            </label>
            <div class="page-controls">
                <button id="first-page" class="icon-button" type="button" title="首页" aria-label="首页">«</button>
                <button id="previous-page" class="icon-button" type="button" title="上一页" aria-label="上一页">‹</button>
                <span id="page-label" class="page-label">0 / 0</span>
                <button id="next-page" class="icon-button" type="button" title="下一页" aria-label="下一页">›</button>
                <button id="last-page" class="icon-button" type="button" title="末页" aria-label="末页">»</button>
            </div>
        </div>
    </section>
</main>

<noscript>此页面需要启用 JavaScript。</noscript>
</body>
</html>
