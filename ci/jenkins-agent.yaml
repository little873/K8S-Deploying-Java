apiVersion: v1
kind: Pod
metadata:
  labels:
    workload: jenkins-build
spec:
  serviceAccountName: ${DEPLOY_SERVICE_ACCOUNT}
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: maven
      image: ${MAVEN_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      env:
        - name: MAVEN_OPTS
          value: -Dmaven.repo.local=/root/.m2/repository -XX:MaxRAMPercentage=75.0
        - name: HTTP_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: NO_PROXY
      resources:
        requests:
          cpu: "${MAVEN_CPU_REQUEST}"
          memory: "${MAVEN_MEMORY_REQUEST}"
        limits:
          cpu: "${MAVEN_CPU_LIMIT}"
          memory: "${MAVEN_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: maven-settings
          mountPath: /root/.m2/settings.xml
          subPath: settings.xml
          readOnly: true
        - name: maven-cache
          mountPath: /root/.m2/repository

    - name: buildkit
      image: ${BUILDKIT_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - cat
      tty: true
      env:
        - name: BUILDKITD_FLAGS
          value: >-
            ${BUILDKITD_FLAGS} --root ${BUILDKIT_STATE_DIR}
        - name: DOCKER_CONFIG
          value: ${BUILDKIT_DOCKER_CONFIG}
        - name: HTTP_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTP_PROXY
        - name: HTTPS_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: HTTPS_PROXY
        - name: NO_PROXY
          valueFrom:
            configMapKeyRef:
              name: ${BUILD_PROXY_CONFIG_MAP}
              key: NO_PROXY
      securityContext:
        runAsNonRoot: true
        runAsUser: ${BUILDKIT_RUN_AS_USER}
        runAsGroup: ${BUILDKIT_RUN_AS_GROUP}
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "${IMAGE_BUILDER_CPU_REQUEST}"
          memory: "${IMAGE_BUILDER_MEMORY_REQUEST}"
        limits:
          cpu: "${IMAGE_BUILDER_CPU_LIMIT}"
          memory: "${IMAGE_BUILDER_MEMORY_LIMIT}"
      volumeMounts:
        - name: buildkit-config
          mountPath: ${BUILDKIT_DOCKER_CONFIG}
          readOnly: true
        - name: buildkit-state
          mountPath: ${BUILDKIT_STATE_DIR}

    - name: helm
      image: ${HELM_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - cat
      tty: true
      env:
        - name: HELM_DRIVER
          value: ${HELM_DRIVER}
      resources:
        requests:
          cpu: "${HELM_CPU_REQUEST}"
          memory: "${HELM_MEMORY_REQUEST}"
        limits:
          cpu: "${HELM_CPU_LIMIT}"
          memory: "${HELM_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: deploy-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true

  volumes:
    - name: maven-settings
      configMap:
        name: ${MAVEN_SETTINGS_CONFIG_MAP}
    - name: maven-cache
      emptyDir: {}
    - name: buildkit-config
      secret:
        secretName: ${BUILDKIT_REGISTRY_SECRET_NAME}
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: buildkit-state
      emptyDir: {}
    - name: deploy-api
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
